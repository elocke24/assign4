<!DOCTYPE html>
<html>
<head>
  <title>Multiplayer Tic Tac Toe</title>
  <style>
    #board button { width: 60px; height: 60px; font-size: 24px; }
    #userList { height: 150px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <p>By: Eric Locke and Zinet Hyssen</p>
  <div id="loginArea">
    Username: <input id="nameInput" />
    <button onclick="submitLogin()">SUBMIT</button>
    <p id="loginMsg"></p>
  </div>
  <div id="lobbyArea" style="display:none;">
    <div id="userList"></div>
    <button id="newGameBtn" onclick="promptNewGame()">NEW-GAME</button>
  </div>
  <div id="newGamePrompt" style="display:none;">
    Choose: <button onclick="chooseSide('X')">X</button>
    <button onclick="chooseSide('O')">O</button>
  </div>
  <div id="gameArea" style="display:none;">
    <div id="status"></div>
    <div id="board"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
